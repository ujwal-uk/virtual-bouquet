<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Maalu ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <div id="particles"></div>

    <!-- Envelope Screen -->

    <section id="envelope-screen">

        <div class="envelope">

            <div class="flap"></div>

            <div class="letter-preview"></div>

            <div class="heart-seal" id="heart">

                ❤

            </div>

        </div>

        <p class="tap-text">

            Tap the heart

        </p>

    </section>

    <!-- Letter -->

    <section id="letter-screen">

        <div class="paper">

            <div class="paper-border">

                <img
                    src="assets/tulips.png"
                    alt="Bouquet"
                    id="bouquet">

                <h1>

                    Happy Girlfriend's Day Maalu ❤️

                </h1>


                <div class="message">

                     <br><br>

                    Dear Maalu,

                    <br><br>

                    Every time you open this page,

                    I hope it reminds you how much you mean to me.

                    <br><br>

                    Thank you for being the brightest part of my days,

                    and the calm in my chaos.

                    <br><br>

                    Happy Girlfriend's Day,

                    my love. ❤️

                    <br><br>

                    Love,

                    <br>

                    <strong>Ujju</strong>

                </div>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
